privacy:
  - id: privacy-by-design
    name: Privacy by Design
    claimed: true
    evidence: https://quanergy.com/wp-content/uploads/PRIVACY_BY_DESIGN_AND_CONSIDERATIONS-96-00144-Rev-A.pdf
    detail: >-
      Quanergy publishes a "Privacy by Design and Considerations" paper and markets LiDAR tracking
      as anonymous by construction — the sensor produces geometry (position, size, velocity,
      heading, class) and no facial or biometric imagery. The published data model bears this out:
      `QTrackable` carries no identity attribute of any kind, only an ephemeral track ID.

standards:
  - id: grpc
    conforms: true
    evidence: >-
      "Third-party client software can make use of open-source remote procedure calls
      (https://grpc.io/) through the QORTEX DTC 2.4 server API commands." Port 17177 is reserved
      for gRPC.
  - id: protobuf3
    conforms: true
    evidence: '"gRPC uses Google Protocol Buffer (Protobuf 3) as its default parameter type."'
    x-caveat: >-
      The `.proto` files are not published. Conformance is asserted by the vendor and visible in
      the printed message definitions, but not independently verifiable from public artefacts.
  - id: http-digest-authentication
    conforms: true
    rfc: 'RFC 7616 (formerly RFC 2617)'
    evidence: >-
      "HTTP Digest authentication protocol — Internet access is not required. Certificate of
      Authority (CA) is not required." Realm is `realm@quanergy`; the reference links the Wikipedia
      article on digest access authentication.
    x-caveat: >-
      The published example uses MD5 hashing and the Python client dials `http://` on port 8080
      while the prose gives `https://`. Rev A does not state whether SHA-256 digest is supported.
  - id: aes-256
    conforms: true
    evidence: >-
      "AES-256 encryption — The object list, zone list and sensor health APIs are encrypted." Key
      material is delivered as a 64-character hex `Q-Token` and unhexed to the AES-256 key.
    x-caveat: >-
      Applies only when Security mode is enabled. Security mode is OFF by default.
  - id: onvif
    conforms: partial
    evidence: >-
      The PTZ camera integration is ONVIF-based — the sensor-state protobuf carries an `ONVIF_PTZ`
      message and camera configuration payloads use `"type": "OnVif"` with an
      `onvif_activation_url`.
    x-note: Conformance is on the client side (QORTEX drives ONVIF cameras); no ONVIF profile claim is published.
  - id: snmp
    conforms: true
    evidence: 'Sensor health telemetry is carried as SNMP data (`SNMP_Q-Track`, `SNMP_S3` messages).'
  - id: nmea
    conforms: partial
    evidence: '`SNMP_Q-Track.nmea_status` is published; used for time/position sync status.'
  - id: uuid-rfc4122
    conforms: true
    evidence: >-
      Zones, counter lines and gRPC client identities are all 128-bit UUIDs in canonical string
