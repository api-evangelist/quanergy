      Deployments in airports, museums, stadiums, casinos and data centres put QORTEX DTC in scope
      of jurisdiction-specific surveillance and biometric-privacy regimes. Quanergy's public
      position is that LiDAR tracking is non-biometric and anonymous by construction, which is
      consistent with the published `QTrackable` schema.
    published_mapping: false
