aid: quanergy
name: Quanergy
description: 'Quanergy Solutions, Inc. is a San Jose, California company that builds 3D LiDAR
  sensors and perception software for physical security, crowd management and industrial
  automation. Its Q-Track, Q-Shield, Q-Vision F540 and M-Series sensors feed QORTEX DTC, an
  on-premises detect-track-classify server that turns point clouds into anonymous person and
  vehicle tracks. QORTEX DTC publishes trackable, zone, counter-line and sensor-health streams
  over configurable TCP ports in protobuf, JSON, XML or NDJSON, and exposes a gRPC API on port
  17177 so VMS, PSIM and access-control platforms — Milestone XProtect, Genetec Security Center,
  Bosch BVMS, Hanwha Wave, Motorola Unity and others — can consume real-time 3D object data.'
image: https://quanergy.com/wp-content/uploads/blue-logo-updated-with-300-x-95.png
