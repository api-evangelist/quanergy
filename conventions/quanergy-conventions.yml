gaps:
  - No idempotency contract for mutating gRPC calls.
  - No per-request trace/correlation identifier.
  - >-
    The `.proto` files that define the entire service are distributed by email request to
    support@quanergy.com, not from a public URL or a buf.build module — so the contract cannot be
    consumed by a machine without a support conversation.
