gaps:
  - >-
    The QORTEX DTC gRPC API has no published client package in any language. The API Reference
    walks a developer through generating a Python stub with `grpc_tools.protoc`, but the
    `.proto` files it compiles (qortex_service.proto, qtrackable.proto, zone_3d.proto,
    zone_requests.proto, sensor_state_list.proto, qortex_server_modes.proto,
    qortex_geometric_types.proto, server_message.proto) are only "available upon request from
    support@quanergy.com" — so no integrator can build a client from public material alone.
